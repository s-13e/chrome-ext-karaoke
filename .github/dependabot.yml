version: 2
updates:
  # npm 의존성 업데이트
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    # minor, patch 업데이트는 하나의 PR로 묶음
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
